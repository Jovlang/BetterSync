name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      couchdb:
        image: couchdb:3.5
        env:
          COUCHDB_USER: bettersync-test
          COUCHDB_PASSWORD: local-ci-only
        ports:
          - 5984:5984
        options: >-
          --health-cmd "curl -f http://localhost:5984/_up"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run test:integration
        env:
          BETTERSYNC_TEST_SERVER: http://localhost:5984
      - uses: actions/upload-artifact@v4
        with:
          name: bettersync-plugin
          path: |
            main.js
            manifest.json
